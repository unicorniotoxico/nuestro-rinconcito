name: App Android

# Compila el APK, lo prueba en un emulador de Android (con un servidor real y un
# segundo jugador en navegador) y, si todo pasa, lo publica en "Releases" para
# bajarlo directo desde el celular:
#   https://github.com/unicorniotoxico/nuestro-rinconcito/releases/latest/download/nuestro-rinconcito.apk
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'public/**'
      - 'shared/**'
      - 'server/**'
      - 'scripts/gen-icons.js'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Firma propia (opcional)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/propia.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/propia.keystore" >> "$GITHUB_ENV"
            echo "Se firma con la llave propia (secreto ANDROID_KEYSTORE_BASE64)."
          else
            echo "Se firma con la firma pública incluida en el repo (android/firma-publica.p12)."
          fi

      - name: Compilar APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verificar firma
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -5
          "$BT/aapt2" dump badging "$APK" | head -3
          cp "$APK" nuestro-rinconcito.apk
          ls -la nuestro-rinconcito.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: nuestro-rinconcito.apk

  probar:
    name: Probar en un emulador Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar versión de prueba (apunta al servidor de la máquina)
        working-directory: android
        run: gradle assembleDebug -PservidorPorDefecto=http://10.0.2.2:3000 --no-daemon

      - name: Levantar el servidor del juego
        run: |
          DATA_DIR="$RUNNER_TEMP/datos" nohup node server/index.js > servidor.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/healthz && break; sleep 0.5; done
          echo; cat servidor.log

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulador + prueba
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash android/test/emulador.sh

      - name: Registro del servidor
        if: always()
        run: cp servidor.log capturas-android/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-android
          path: capturas-android

  publicar:
    name: Publicar en Releases
    needs: [compilar, probar]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="1.0.${{ github.run_number }}"
          cat > notas.md <<EOF
          App de Android de **Nuestro rinconcito**, versión $V.

          **Instalar:** en el celular abrí este enlace y tocá *Descargar*:
          https://github.com/${{ github.repository }}/releases/latest/download/nuestro-rinconcito.apk
          Si Android pregunta, permití instalar apps desde el navegador.

          La primera vez te pide la dirección del servidor de su isla (por ejemplo https://nuestro-rinconcito.onrender.com) o el enlace de invitación.
          Las versiones nuevas se instalan encima sin perder la isla ni la llave.

          Probada en un emulador Android antes de publicarse (capturas en la ejecución de Actions).
          EOF
          gh release create "app-v$V" nuestro-rinconcito.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "App Android $V" \
            --notes-file notas.md \
            --latest
